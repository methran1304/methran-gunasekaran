<div class="flex flex-col min-h-dvh">
  <app-navbar class="bar-sticky"></app-navbar>

  <!-- main fills the space between nav and footer; pages that want to
       fill it (home) can flex inside it instead of guessing heights -->
  <main class="flex-1 flex flex-col">
    <div class="app-main-content flex-1 flex flex-col w-full py-8 sm:py-10 lg:py-12">
      <router-outlet></router-outlet>
    </div>
  </main>

  <app-footer class="bar-footer"></app-footer>

  <button
    id="scroll-top-btn"
    (click)="scrollToTop()"
    [hidden]="!showScrollToTopBtn"
    class="font-mono bg-background text-primary border border-primary/20 
    rounded-full hover:border-primary/40 transition-all duration-200 text-sm fixed bottom-[20px] right-[30px] z-50 p-2 cursor-pointer"
  >
    <lucide-angular [img]="arrowUpIcon" class="size-6"></lucide-angular>
  </button>
</div>
