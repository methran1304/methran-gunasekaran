<footer class="w-full bg-background">
  <!-- one centred row, the same height as the nav, like a terminal status
     bar; centred so the fixed back-to-top button (bottom right) never covers
     it. Phones stack it into two short lines. -->
  <div
    class="app-container flex flex-col sm:flex-row items-center justify-center gap-3 sm:gap-8 py-4 sm:py-0 sm:h-16"
  >
    <!-- contact -->
    <div class="flex items-center">
      <span class="hidden sm:inline text-sm font-medium me-7"
        ><span class="mr-1 font-extrabold text-accent">$</span
        >./connect.sh</span
      >

      <div class="flex items-center gap-7">
        <a
          href="https://www.linkedin.com/in/methran/"
          target="_blank"
          class="link-chevron text-secondary hover:text-accent"
          aria-label="LinkedIn"
        >
          <lucide-angular [img]="linkedInIcon" [size]="20"></lucide-angular>
        </a>

        <a
          href="https://github.com/methran1304"
          target="_blank"
          class="link-chevron text-secondary hover:text-accent"
          aria-label="GitHub"
        >
          <lucide-angular [img]="githubIcon" [size]="20"></lucide-angular>
        </a>

        <a
          href="mailto:g.methran@gmail.com?subject=Portfolio%20Inquiry"
          class="link-chevron text-secondary hover:text-accent"
          aria-label="Email"
        >
          <lucide-angular [img]="mailIcon" [size]="20"></lucide-angular>
        </a>
      </div>
    </div>

    <span class="hidden sm:block h-4 w-px bg-borders" aria-hidden="true"></span>

    <span class="text-[12px] text-secondary whitespace-nowrap">
      Copyright © 2026 methran.dev
    </span>
  </div>
</footer>
