<nav class="w-full bg-background">
  <div class="app-container">
    
    <div class="flex items-center justify-between h-16">
      <!-- wordmark: bold name, green dot, light grey "dev" -->
      <a [routerLink]="['/']" class="group text-2xl -tracking-tight">
        <span class="font-extrabold group-hover:text-accent transition-colors">methran</span><span class="font-extrabold text-accent">.</span><span class="font-normal text-secondary">dev</span>
      </a>

      <div class="flex items-center gap-4">
        <ul class="hidden md:flex items-center gap-8 ms-2 text-lg">
          @for (item of navItems; track item.href) {
            <li>
              <a
                [routerLink]="item.href"
                routerLinkActive="active"
                class="font-semibold link-underline"
                >{{ item.label }}</a
              >
            </li>
          }
        </ul>

        <button class="md:pl-4 transition-colors" (click)="toggleTheme()" aria-label="Toggle colour theme">
          @if (isDarkTheme) {
            <lucide-angular [img]="sunIcon" class="cursor-pointer hover:text-accent font-bold my-icon"></lucide-angular>
          } @else {
            <lucide-angular [img]="moonIcon" class="cursor-pointer hover:text-accent font-bold my-icon"></lucide-angular>
          }
        </button>

        <button
          class="btn-icon md:hidden"
          aria-label="Open menu"
          [attr.aria-expanded]="menuOpen"
          (click)="toggleMenu()"
        >
          <span class="block w-5 h-0.5 bg-current mb-1"></span>
          <span class="block w-5 h-0.5 bg-current mb-1"></span>
          <span class="block w-5 h-0.5 bg-current"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile dropdown -->
  @if (menuOpen) {
    <div class="md:hidden border-t border-borders bg-background/95">
      <div class="app-container py-3">
        <ul class="flex flex-col gap-2">
          @for (item of navItems; track item.href) {
            <li>
              <a
                [routerLink]="item.href"
                (click)="closeMenu()"
                class="font-semibold block py-2"
                >{{ item.label }}</a
              >
            </li>
          }
        </ul>
      </div>
    </div>
  }
</nav>
